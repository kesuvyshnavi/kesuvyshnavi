name: Generate Snake

on:
  # Runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  # Runs on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pink snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23FF69B4&color_dots=%23ebedf0,%23F8BBD0,%23EF93C4,%23FF69B4,%23C2185B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_dots=%23161b22,%23F8BBD0,%23EF93C4,%23FF69B4,%23C2185B

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
